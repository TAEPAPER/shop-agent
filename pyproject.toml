[project]
name = "shop-agent"
version = "0.1.0"
description = "한국어 쇼핑 어시스턴트 에이전트 (Agentic RAG over product reviews)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "torch>=2.5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "rich>=13.0",
]

[project.scripts]
shop-agent = "shop_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_agent"]

# Windows/Linux에서는 GPU(CUDA 12.8)용 PyTorch를 받는다. PyPI 기본 torch는 Windows에서 CPU 전용이다.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
