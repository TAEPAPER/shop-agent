[project]
name = "shop-agent"
version = "0.1.0"
description = "한국어 쇼핑 어시스턴트 에이전트 (Agentic RAG over product reviews)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "torch>=2.5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "rich>=13.0",
]

[project.scripts]
shop-agent = "shop_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_agent"]

# 참고: Windows에서 PyPI 기본 torch는 CPU 전용이다.
# 이 PC는 Windows 스마트 앱 컨트롤이 평판이 확인되지 않은 새 DLL을 차단한다.
# 그래서 이 PC에서 이미 로드가 확인된 버전으로 고정한다. 다른 PC나 CI에서는 지워도 된다.
[tool.uv]
constraint-dependencies = [
    "torch==2.14.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
